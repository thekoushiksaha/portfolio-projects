server:
  port: 8080

spring:
  application:
    name: outspend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/outspend
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  name: OutSpend
  version: 1.0.0

  jwt:
    secret: ${JWT_SECRET}
    access-expiry-minutes: 15
    refresh-expiry-days: 7
  admin:
    email: ${ADMIN_EMAIL:admin@outspend.com}
    password: ${ADMIN_PASSWORD:Admin@12345}